<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Editor de Itens — Neomundi</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#0b1626;color:#e8f4ff;font:14px system-ui,sans-serif}
header{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:8px 10px;background:#12233b;border-bottom:1px solid #65c8ff44;position:sticky;top:0;z-index:5}
header b{margin-right:auto}button{background:#1f4a73;border:1px solid #65c8ff66;color:#fff;border-radius:8px;padding:8px 12px;font:inherit}button.g{background:#1d6b3a}button.r{background:#7a2a2a}
main{display:flex;flex-wrap:wrap;gap:10px;padding:10px}#list{flex:1 1 240px;max-width:340px}#form{flex:2 1 340px}
.it{display:flex;gap:8px;align-items:center;padding:8px;margin-bottom:4px;border:1px solid #65c8ff2a;border-radius:8px;background:#122238;width:100%;text-align:left}
.it.sel{border-color:#ffd24c;background:#1c3a5e}.it span:first-child{font-size:22px}small{opacity:.7}
label{display:block;margin:8px 0 2px;color:#9fc3e6;font-size:12px}input,select,textarea{width:100%;background:#0d1a2b;color:#fff;border:1px solid #65c8ff44;border-radius:6px;padding:7px;font:inherit}
textarea{min-height:60px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px}.fx{border:1px solid #ffd24c55;border-radius:8px;padding:8px;margin:6px 0;background:#241f10}
.fx .row{display:flex;gap:6px;flex-wrap:wrap}.fx .row div{flex:1 1 90px}h3{margin:14px 0 4px}.msg{padding:6px 10px;color:#ffd24c}
</style></head><body>
<header><b>🛠 Editor de Itens</b><button id="bNew">＋ Novo</button><button id="bDup">⧉ Duplicar</button><button id="bDel" class="r">🗑 Excluir</button><button id="bTest" class="g">▶ Testar no jogo</button><button id="bExp">⬇ Exportar</button><button id="bImp">⬆ Importar</button><button id="bRst" class="r">↺ Padrão</button></header>
<div class="msg" id="msg">Itens finais, sem receita. Cada item tem categoria, preço, atributos e efeitos. Use “Testar no jogo” e abra o jogo neste mesmo aparelho.</div>
<main><div id="list"></div><div id="form"></div></main>
<input type="file" id="file" accept=".json,application/json" style="display:none">
<script>
const DEFAULT={"versao":1,"itens":[{"id":"cinturao","n":"Cinturão de Guerra","ic":"🥋","cat":"def","c":900,"d":"Resistente e rápido de recarregar: defesa híbrida, vida e um leve bônus de dano.","st":{"cdr":10,"pdef":45,"mdef":45,"hp":320,"atk":8},"fx":[]},{"id":"adagas","n":"Adagas do Alvorecer","ic":"🔪","cat":"atk","c":850,"d":"Velocidade de ataque e penetração híbrida, e seus golpes cortam a cura do alvo.","st":{"as":30,"penHyb":12,"atk":15},"fx":[{"k":"healcut","v":0.4,"t":3}]},{"id":"elmo","n":"Elmo da Pureza","ic":"⛑️","cat":"def","c":850,"d":"Defesas altas e purificação automática de controles.","st":{"pdef":50,"mdef":50,"hp":250},"fx":[{"k":"purify","cd":45}]},{"id":"calice","n":"Cálice do Apogeu","ic":"🏆","cat":"mag","c":950,"d":"Mana, dano mágico, redução de recarga, leve penetração mágica e regeneração extra de vida.","st":{"ap":32,"mana":300,"cdr":10,"penMag":8,"hpRegen":6},"fx":[]},{"id":"coura","n":"Couraça da Aflição","ic":"🔥","cat":"def","c":950,"d":"Muita vida; queima os inimigos próximos com dano físico.","st":{"hp":650,"pdef":40},"fx":[{"k":"burnAura","dps":14,"r":3,"ty":"phys"}]},{"id":"cetro","n":"Cetro Opulento","ic":"🪄","cat":"mag","c":800,"d":"Dano mágico moderado, mana extra e leve redução de recarga.","st":{"ap":28,"cdr":8,"mana":250},"fx":[]},{"id":"lanca","n":"Lança de Ruptura","ic":"🔱","cat":"atk","c":900,"d":"Penetração híbrida moderada e leve dano híbrido.","st":{"penHyb":18,"hyb":14},"fx":[]},{"id":"punhal","n":"Punhal Ardente","ic":"🗡️","cat":"atk","c":900,"d":"Aplica queimação; leve chance e dano de crítico.","st":{"atk":18,"crit":12,"critDmg":20},"fx":[{"k":"burn","dps":10,"t":3,"ty":"phys"}]},{"id":"talisma","n":"Talismã Altruísta","ic":"🧿","cat":"mag","c":800,"d":"Para suportes: cura aliados próximos e reduz recargas.","st":{"ap":12,"cdr":14,"hp":220,"mana":200,"hpRegen":5},"fx":[{"k":"healAura","v":0.04,"every":5}]},{"id":"foice","n":"Foice Maléfica","ic":"🌙","cat":"atk","c":900,"d":"Ataques deixam o alvo lento, dano físico extra e breve velocidade de ataque.","st":{"atk":22},"fx":[{"k":"slow","t":0.8},{"k":"asBurst","as":35,"t":2}]},{"id":"protetor","n":"Protetor da Soberba","ic":"🪖","cat":"def","c":900,"d":"Vida moderada, defesa mágica e menos duração de lentidões e controles.","st":{"hp":400,"mdef":65},"fx":[{"k":"tenacity","v":0.35}]},{"id":"anel","n":"Anel Malevolente","ic":"💍","cat":"mag","c":700,"d":"Leve dano mágico e redução de recargas.","st":{"ap":20,"cdr":14},"fx":[]},{"id":"manto","n":"Manto do Condenado","ic":"🧥","cat":"def","c":800,"d":"Velocidade de movimento leve, regenera vida nas moitas e pouca penetração mágica.","st":{"spd":0.4,"hp":250,"mdef":40,"penMag":6},"fx":[{"k":"bushRegen","v":0.04}]},{"id":"varinha","n":"Varinha Caótica","ic":"✨","cat":"mag","c":1000,"d":"Dano mágico alto, regeneração de mana e debuffs que duram mais.","st":{"ap":40,"manaRegen":10},"fx":[{"k":"debuffExt","v":0.2}]},{"id":"mascara","n":"Máscara do Sigilo","ic":"🎭","cat":"atk","c":850,"d":"Invisibilidade passiva fora de combate, leve velocidade e crítico.","st":{"atk":14,"crit":12,"spd":0.3},"fx":[{"k":"stealth","t":4}]},{"id":"plumas","n":"Plumas Sangrentas","ic":"🪶","cat":"mag","c":850,"d":"Leve dano mágico, vampirismo e queimação mágica.","st":{"ap":18,"vamp":12},"fx":[{"k":"burn","dps":10,"t":3,"ty":"magic"}]},{"id":"botas_corrida","n":"Botas de Corrida","ic":"🥾","cat":"mov","c":350,"d":"Máxima velocidade de movimento.","st":{"spd":0.9},"fx":[],"uniq":"botas"},{"id":"botas_arcano","n":"Botas do Arcanista","ic":"👢","cat":"mov","c":450,"d":"Velocidade, redução de recarga e penetração mágica.","st":{"spd":0.5,"cdr":10,"penMag":6},"fx":[],"uniq":"botas"},{"id":"botas_aco","n":"Botas de Aço","ic":"🛡️","cat":"mov","c":450,"d":"Velocidade e defesa física; reduz lentidões.","st":{"spd":0.5,"pdef":45},"fx":[{"k":"tenacity","v":0.2}],"uniq":"botas"},{"id":"botas_mistica","n":"Botas Místicas","ic":"🧿","cat":"mov","c":450,"d":"Velocidade e defesa mágica.","st":{"spd":0.5,"mdef":45},"fx":[],"uniq":"botas"},{"id":"botas_cacador","n":"Botas do Caçador","ic":"🏹","cat":"mov","c":450,"d":"Velocidade, leve ataque e penetração híbrida.","st":{"spd":0.5,"atk":6,"penHyb":8},"fx":[],"uniq":"botas"},{"id":"pocao","n":"Poção de Cura","ic":"🧪","cat":"out","c":80,"d":"Cura 250 de vida na hora. Não ocupa espaço.","st":{},"fx":[],"cons":true,"heal":250}]};
const STATS={"atk": "Ataque físico", "ap": "Poder mágico", "hyb": "Dano híbrido", "hp": "Vida", "pdef": "Defesa física", "mdef": "Defesa mágica", "as": "Vel. de ataque %", "crit": "Chance crítica %", "critDmg": "Dano crítico %", "ls": "Roubo de vida %", "vamp": "Vampirismo %", "cdr": "Redução de recarga %", "hpRegen": "Regen. de vida", "mana": "Mana", "manaRegen": "Regen. de mana", "spd": "Vel. de movimento", "penPhys": "Penetração física %", "penMag": "Penetração mágica %", "penHyb": "Penetração híbrida %"},FX={"healcut": {"n": "Corta Cura", "d": "Golpes reduzem a cura recebida pelo alvo.", "p": [["v", "Redução (0 a 1)", 0.4], ["t", "Duração (s)", 3]]}, "burn": {"n": "Queimação", "d": "Golpes queimam o alvo (dano por segundo).", "p": [["dps", "Dano por segundo", 10], ["t", "Duração (s)", 3], ["ty", "Tipo de dano", "phys", ["phys", "magic"]]]}, "slow": {"n": "Lentidão ao atingir", "d": "Golpes deixam o alvo lento.", "p": [["t", "Duração (s)", 0.8]]}, "asBurst": {"n": "Surto de Ataque", "d": "Ao atingir, ganha velocidade de ataque por um tempo.", "p": [["as", "Vel. de ataque %", 30], ["t", "Duração (s)", 2]]}, "tenacity": {"n": "Tenacidade", "d": "Reduz a duração de atordoamentos e lentidões recebidos.", "p": [["v", "Redução (0 a 1)", 0.35]]}, "purify": {"n": "Purificação", "d": "Remove controles automaticamente, com recarga.", "p": [["cd", "Recarga (s)", 45]]}, "bushRegen": {"n": "Regeneração nas Moitas", "d": "Recupera vida dentro de moitas.", "p": [["v", "% da vida máx. por segundo (0 a 1)", 0.04]]}, "stealth": {"n": "Sigilo", "d": "Fica invisível fora de combate.", "p": [["t", "Segundos sem atacar/sofrer dano", 4]]}, "healAura": {"n": "Aura de Cura", "d": "Cura periodicamente você e aliados próximos.", "p": [["v", "% da vida máx. (0 a 1)", 0.05], ["every", "A cada (s)", 5]]}, "burnAura": {"n": "Aura Flamejante", "d": "Causa dano contínuo aos inimigos próximos.", "p": [["dps", "Dano por segundo", 12], ["r", "Alcance", 3], ["ty", "Tipo de dano", "phys", ["phys", "magic"]]]}, "debuffExt": {"n": "Prolongar Debuffs", "d": "Atordoamentos e lentidões que você aplica duram mais.", "p": [["v", "Intensidade (0 a 1)", 0.2]]}},CATS={atk:'Ataque',mag:'Magia',def:'Defesa',mov:'Movimento',out:'Outros'};
let data=load(),cur=0;
function load(){try{const o=JSON.parse(localStorage.getItem('nm_items_override')||'null');if(o&&o.itens&&o.itens.length)return o}catch(e){}return JSON.parse(JSON.stringify(DEFAULT))}
const $=id=>document.getElementById(id),say=t=>$('msg').textContent=t;
function slug(n){return n.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9]+/g,'_').replace(/^_|_$/g,'')||'item'}
function list(){$('list').innerHTML=data.itens.map((it,i)=>`<button class="it${i===cur?' sel':''}" data-i="${i}"><span>${it.ic||'❔'}</span><span><b>${it.n}</b><br><small>${CATS[it.cat]||it.cat} · 💰${it.c}</small></span></button>`).join('')}
function form(){const it=data.itens[cur];if(!it){$('form').innerHTML='';return}
 $('form').innerHTML=`<label>Nome</label><input id="f_n" value="${esc(it.n)}"><div class="grid"><div><label>Ícone (emoji)</label><input id="f_ic" value="${esc(it.ic||'')}"></div><div><label>Categoria</label><select id="f_cat">${Object.entries(CATS).map(([k,v])=>`<option value="${k}"${k===it.cat?' selected':''}>${v}</option>`).join('')}</select></div><div><label>Preço (ouro)</label><input id="f_c" type="number" min="0" value="${it.c}"></div><div><label>Grupo único (ex.: botas)</label><input id="f_uniq" value="${esc(it.uniq||'')}" placeholder="vazio = sem limite"></div><div><label>Cura imediata (poção)</label><input id="f_heal" type="number" value="${it.heal||0}"></div></div>
 <label>Descrição</label><textarea id="f_d">${esc(it.d||'')}</textarea><h3>Atributos</h3><div class="grid">${Object.entries(STATS).map(([k,n])=>`<div><label>${n}</label><input data-st="${k}" type="number" step="any" value="${it.st[k]||''}"></div>`).join('')}</div>
 <h3>Efeitos especiais</h3><div id="fxs">${it.fx.map((f,i)=>fxHtml(f,i)).join('')}</div><div style="display:flex;gap:6px"><select id="fxSel">${Object.entries(FX).map(([k,v])=>`<option value="${k}">${v.n}</option>`).join('')}</select><button id="fxAdd" style="white-space:nowrap">＋ Efeito</button></div><p><small>ID do item: <b>${it.id}</b> (usado pelos bots; não mude nos itens originais).</small></p>`}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;')}
function fxHtml(f,i){const d=FX[f.k];if(!d)return'';return `<div class="fx"><b>${d.n}</b> <button data-rm="${i}" class="r" style="float:right;padding:2px 8px">✕</button><br><small>${d.d}</small><div class="row">${d.p.map(([k,n,def,opt])=>`<div><label>${n}</label>${opt?`<select data-fx="${i}" data-k="${k}">${opt.map(o=>`<option${(f[k]||def)===o?' selected':''}>${o}</option>`).join('')}</select>`:`<input data-fx="${i}" data-k="${k}" type="number" step="any" value="${f[k]===undefined?def:f[k]}">`}</div>`).join('')}</div></div>`}
function save(){const it=data.itens[cur];if(!it)return;it.n=$('f_n').value||'Item';it.ic=$('f_ic').value;it.cat=$('f_cat').value;it.c=+$('f_c').value||0;it.d=$('f_d').value;const u=$('f_uniq').value.trim();if(u)it.uniq=u;else delete it.uniq;const h=+$('f_heal').value;if(h){it.cons=true;it.heal=h}else{delete it.cons;delete it.heal}
 it.st={};document.querySelectorAll('[data-st]').forEach(e=>{const v=parseFloat(e.value);if(v)it.st[e.dataset.st]=v});
 document.querySelectorAll('[data-fx]').forEach(e=>{const f=it.fx[+e.dataset.fx];const v=e.tagName==='SELECT'?e.value:parseFloat(e.value);f[e.dataset.k]=v});list()}
document.addEventListener('input',e=>{if(e.target.closest('#form'))save()});
document.addEventListener('click',e=>{const t=e.target.closest('button');if(!t)return;
 if(t.dataset.i!==undefined){cur=+t.dataset.i;list();form();return}
 if(t.dataset.rm!==undefined){data.itens[cur].fx.splice(+t.dataset.rm,1);form();return}
 if(t.id==='fxAdd'){const k=$('fxSel').value,f={k};FX[k].p.forEach(([pk,n,def])=>f[pk]=def);data.itens[cur].fx.push(f);form();return}
 if(t.id==='bNew'){let id='item',n=1;const ids=new Set(data.itens.map(i=>i.id));while(ids.has(id+n))n++;data.itens.push({id:id+n,n:'Novo item',ic:'⭐',cat:'atk',c:800,d:'',st:{},fx:[]});cur=data.itens.length-1;list();form();return}
 if(t.id==='bDup'){const o=JSON.parse(JSON.stringify(data.itens[cur]));let n=2;const ids=new Set(data.itens.map(i=>i.id));while(ids.has(o.id+'_'+n))n++;o.id+='_'+n;o.n+=' (cópia)';data.itens.push(o);cur=data.itens.length-1;list();form();return}
 if(t.id==='bDel'){if(confirm('Excluir "'+data.itens[cur].n+'"? Os bots que usam esse item vão pular ele.')){data.itens.splice(cur,1);cur=Math.max(0,cur-1);list();form()}return}
 if(t.id==='bTest'){const bad=chk();if(bad)return say(bad);localStorage.setItem('nm_items_override',JSON.stringify(data));say('✅ Salvo neste aparelho. Abra (ou recarregue) o jogo para testar.');return}
 if(t.id==='bExp'){const bad=chk();if(bad)return say(bad);const j=JSON.stringify(data,null,1),b=new Blob([j],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='itens.json';a.click();try{navigator.clipboard.writeText(j)}catch(_){}say('⬇ itens.json baixado (e copiado).');return}
 if(t.id==='bImp'){$('file').click();return}
 if(t.id==='bRst'){if(confirm('Voltar aos itens padrão? Isso apaga o que você editou aqui.')){localStorage.removeItem('nm_items_override');data=JSON.parse(JSON.stringify(DEFAULT));cur=0;list();form();say('Itens padrão restaurados.')}return}});
$('file').onchange=e=>{const f=e.target.files[0];if(!f)return;f.text().then(t=>{try{const o=JSON.parse(t);if(!o.itens||!Array.isArray(o.itens))throw 0;data=o;cur=0;list();form();say('Importado: '+o.itens.length+' itens.')}catch(_){say('Arquivo inválido.')}})};
function chk(){const ids=new Set();for(const it of data.itens){if(!it.id)return'Item sem ID.';if(ids.has(it.id))return'ID repetido: '+it.id;ids.add(it.id)}return''}
list();form();
</script></body></html>
